    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #e8edf5;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(74, 108, 247, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(124, 58, 237, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(56, 161, 105, 0.04) 0%, transparent 40%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(74, 108, 247, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 70% 60%, rgba(124, 58, 237, 0.02) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo .icon-wrapper {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(74, 108, 247, 0.1);
            margin-bottom: 16px;
        }

        .logo i {
            font-size: 2.8rem;
            color: #4a6cf7;
            background: linear-gradient(135deg, #4a6cf7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a202c;
            margin-top: 0;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.1);
        }

        .logo p {
            color: rgba(26, 32, 44, 0.7);
            font-size: 0.95rem;
            margin-top: 4px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(26, 32, 44, 0.8);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .form-group label .required {
            color: #e53e3e;
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(74, 108, 247, 0.5);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.08);
        }

        .input-wrapper .icon {
            padding: 0 12px 0 18px;
            color: rgba(26, 32, 44, 0.4);
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .input-wrapper:focus-within .icon {
            color: #4a6cf7;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 0;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: #1a202c;
            outline: none;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: rgba(26, 32, 44, 0.35);
        }

        .input-wrapper .toggle-password {
            padding: 0 18px 0 8px;
            color: rgba(26, 32, 44, 0.3);
            cursor: pointer;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .input-wrapper .toggle-password:hover {
            color: #4a6cf7;
        }

        .input-wrapper.error {
            border-color: rgba(229, 62, 62, 0.5);
            background: rgba(229, 62, 62, 0.06);
        }

        .input-wrapper.error:focus-within {
            border-color: #e53e3e;
            box-shadow: 0 0 0 4px rgba(229, 62, 62, 0.08);
        }

        .input-wrapper.error .icon {
            color: #e53e3e;
        }

        .input-wrapper.success {
            border-color: rgba(56, 161, 105, 0.4);
            background: rgba(56, 161, 105, 0.04);
        }

        .input-wrapper.success .icon {
            color: #38a169;
        }

        .validation-hint {
            font-size: 0.75rem;
            color: rgba(26, 32, 44, 0.5);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 20px;
            transition: all 0.3s;
        }

        .validation-hint.error {
            color: #e53e3e;
        }

        .validation-hint.success {
            color: #38a169;
        }

        .validation-hint i {
            font-size: 0.7rem;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(26, 32, 44, 0.7);
            cursor: pointer;
            font-weight: 400;
        }

        .remember-forgot label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4a6cf7;
            cursor: pointer;
        }

        .remember-forgot a {
            color: #4a6cf7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .remember-forgot a:hover {
            color: #3b5de7;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #4a6cf7, #7c3aed);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(74, 108, 247, 0.2);
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(74, 108, 247, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: rgba(26, 32, 44, 0.6);
        }

        .register-link a {
            color: #4a6cf7;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #3b5de7;
            text-decoration: underline;
        }

        .server-error {
            background: rgba(229, 62, 62, 0.08);
            border: 1px solid rgba(229, 62, 62, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 10px;
            color: #e53e3e;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            animation: slideDown 0.3s ease;
        }

        .server-error.show {
            display: flex;
        }

        .server-error i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .server-error .error-text {
            flex: 1;
            word-break: break-word;
        }

        .server-error .toast-close {
            background: none;
            border: none;
            color: #e53e3e;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .server-error .toast-close:hover {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 18px 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 16px 48px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            animation: toastSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.3s ease;
        }

        .toast .toast-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .toast.success .toast-icon {
            background: rgba(56, 161, 105, 0.15);
            color: #38a169;
        }

        .toast.error .toast-icon {
            background: rgba(229, 62, 62, 0.15);
            color: #e53e3e;
        }

        .toast.info .toast-icon {
            background: rgba(74, 108, 247, 0.15);
            color: #4a6cf7;
        }

        .toast .toast-body {
            flex: 1;
        }

        .toast .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a202c;
            margin-bottom: 2px;
        }

        .toast .toast-message {
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.7);
            line-height: 1.4;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(26, 32, 44, 0.3);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            transition: all 0.2s;
            border-radius: 12px;
            flex-shrink: 0;
            margin-top: -4px;
        }

        .toast .toast-close:hover {
            color: rgba(26, 32, 44, 0.6);
            background: rgba(255, 255, 255, 0.1);
        }

        .toast.removing {
            animation: toastSlideOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes toastSlideOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(40px) scale(0.95);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .logo h1 {
                font-size: 1.5rem;
            }

            .input-wrapper input {
                font-size: 0.9rem;
                padding: 12px 14px 12px 0;
            }

            .btn-login {
                padding: 14px;
                font-size: 0.95rem;
            }

            .toast-container {
                top: 16px;
                right: 16px;
                max-width: calc(100% - 32px);
            }

            .toast {
                padding: 14px 18px;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="login-card">
        <div class="logo">
            <div class="icon-wrapper">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>
        </div>

        <form id="loginForm" novalidate>
            <!-- Server Error Display -->
            <div class="server-error" id="serverError">
                <i class="fas fa-exclamation-circle"></i>
                <span class="error-text" id="serverErrorMessage">Invalid credentials</span>
                <button type="button" class="toast-close" onclick="hideServerError()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Username/Email -->
            <div class="form-group">
                <label>Username or Email <span class="required">*</span></label>
                <div class="input-wrapper" id="usernameWrapper">
                    <span class="icon"><i class="fas fa-user"></i></span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        placeholder="Enter your username or email" 
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="validation-hint" id="usernameHint">
                    <i class="fas fa-info-circle"></i> Enter your username or email
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="input-wrapper" id="passwordWrapper">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Enter your password" 
                        autocomplete="current-password"
                        required
                    >
                    <span class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="validation-hint" id="passwordHint">
                    <i class="fas fa-info-circle"></i> Enter your password
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="remember" name="remember">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/register">Create one</a>
        </div>
    </div>

    <script>
        function showToast(message, type = 'info', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            const titles = {
                success: 'Welcome! ✨',
                error: 'Error ⚠️',
                warning: 'Warning',
                info: 'Information'
            };
            
            toast.innerHTML = `
                <div class="toast-icon"><i class="${icons[type] || icons.info}"></i></div>
                <div class="toast-body">
                    <div class="toast-title">${title || titles[type] || 'Information'}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.closest('.toast').remove()"><i class="fas fa-times"></i></button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('removing');
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 400);
                }
            }, 5000);
            
            toast.addEventListener('click', (e) => {
                if (e.target.closest('.toast-close')) return;
                toast.classList.add('removing');
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 400);
            });
        }

        function showServerError(message) {
            const errorDiv = document.getElementById('serverError');
            const errorMsg = document.getElementById('serverErrorMessage');
            errorMsg.textContent = message;
            errorDiv.classList.add('show');
            
            clearTimeout(window._serverErrorTimeout);
            window._serverErrorTimeout = setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 8000);
        }

        function hideServerError() {
            const errorDiv = document.getElementById('serverError');
            errorDiv.classList.remove('show');
            clearTimeout(window._serverErrorTimeout);
        }

        const form = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const remember = document.getElementById('remember');

        const usernameWrapper = document.getElementById('usernameWrapper');
        const passwordWrapper = document.getElementById('passwordWrapper');

        const usernameHint = document.getElementById('usernameHint');
        const passwordHint = document.getElementById('passwordHint');

        document.getElementById('togglePassword').addEventListener('click', function() {
            const type = password.type === 'password' ? 'text' : 'password';
            password.type = type;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        function validateField(input, wrapper, hint, errorMsg, successMsg) {
            const value = input.value.trim();
            
            if (value.length === 0) {
                wrapper.classList.remove('error', 'success');
                hint.className = 'validation-hint';
                hint.innerHTML = `<i class="fas fa-info-circle"></i> ${errorMsg}`;
                return false;
            }

            wrapper.classList.remove('error');
            wrapper.classList.add('success');
            hint.className = 'validation-hint success';
            hint.innerHTML = `<i class="fas fa-check-circle"></i> ${successMsg}`;
            return true;
        }

        username.addEventListener('input', function() {
            hideServerError();
            validateField(
                this,
                usernameWrapper,
                usernameHint,
                'Enter your username or email',
                'Looks good ✓'
            );
        });

        password.addEventListener('input', function() {
            hideServerError();
            validateField(
                this,
                passwordWrapper,
                passwordHint,
                'Enter your password',
                'Password entered ✓'
            );
        });

        // ===== FORM SUBMISSION =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideServerError();

            // Validate fields
            const isUsernameValid = validateField(
                username,
                usernameWrapper,
                usernameHint,
                'Enter your username or email',
                'Looks good ✓'
            );

            const isPasswordValid = validateField(
                password,
                passwordWrapper,
                passwordHint,
                'Enter your password',
                'Password entered ✓'
            );

            if (!isUsernameValid || !isPasswordValid) {
                showToast('Please fill in all fields.', 'error', 'Validation Error');
                return;
            }

            // Prepare form data
            const formData = {
                username: username.value.trim(),
                password: password.value,
                remember: remember.checked
            };

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span class="spinner"></span> Signing In...`;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Login successful!', 'success', 'Welcome Back!');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard';
                    }, 1000);
                } else {
                    const errorMsg = data.message || data.error || 'Invalid username or password.';
                    showServerError(errorMsg);
                    showToast(errorMsg, 'error', 'Login Failed');
                    
                    // Shake animation for error feedback
                    document.querySelector('.login-card').style.animation = 'shake 0.5s ease';
                    setTimeout(() => {
                        document.querySelector('.login-card').style.animation = '';
                    }, 500);
                }
            } catch (error) {
                const errorMsg = 'Network error. Please check your connection.';
                showServerError(errorMsg);
                showToast(errorMsg, 'error', 'Error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Sign In`;
            }
        });

        // ===== SHAKE ANIMATION =====
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
                20%, 40%, 60%, 80% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        usernameHint.innerHTML = `<i class="fas fa-info-circle"></i> Enter your username or email`;
        passwordHint.innerHTML = `<i class="fas fa-info-circle"></i> Enter your password`;

        const savedUsername = localStorage.getItem('saved_username');
        if (savedUsername) {
            username.value = savedUsername;
            usernameWrapper.classList.add('success');
            usernameHint.className = 'validation-hint success';
            usernameHint.innerHTML = `<i class="fas fa-check-circle"></i> Looks good ✓`;
        }
    </script>
</body>
</html>
