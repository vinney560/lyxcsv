<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to File Converter</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f0f4f8;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 123, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 200, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }

        .section:hover {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: #007bff;
            font-size: 1.4rem;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(0, 123, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .section:hover .section-title i {
            background: rgba(0, 123, 255, 0.15);
            transform: scale(1.05);
        }

        .section-title span {
            background: linear-gradient(135deg, #007bff, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            color: rgba(26, 32, 44, 0.5);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .glass-textarea {
            width: 100%;
            min-height: 200px;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            color: #1a202c;
            font-size: 0.95rem;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            line-height: 1.8;
            resize: vertical;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .glass-textarea:focus {
            border-color: rgba(0, 123, 255, 0.3);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.04), 0 8px 30px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }

        .glass-textarea::placeholder {
            color: rgba(26, 32, 44, 0.3);
        }

        .glass-textarea::-webkit-scrollbar {
            width: 6px;
        }

        .glass-textarea::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 10px;
        }

        .glass-textarea::-webkit-scrollbar-thumb {
            background: rgba(0, 123, 255, 0.15);
            border-radius: 10px;
        }

        .glass-textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 123, 255, 0.25);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .controls .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            flex: 1;
            min-width: 140px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007bff, #00b4d8);
            color: white;
            box-shadow: 0 4px 20px rgba(0, 123, 255, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 123, 255, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #e74c5e);
            color: white;
            box-shadow: 0 4px 20px rgba(220, 53, 69, 0.12);
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(220, 53, 69, 0.25);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1a202c;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-3px);
        }

        .btn .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filename-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filename-row label {
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(26, 32, 44, 0.6);
            white-space: nowrap;
        }

        .filename-row input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.4);
            color: #1a202c;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            min-width: 150px;
            font-family: inherit;
        }

        .filename-row input:focus {
            border-color: rgba(0, 123, 255, 0.3);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.04);
        }

        .filename-row .filename-ext {
            color: rgba(26, 32, 44, 0.3);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .radio-group {
            display: flex;
            gap: 24px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: rgba(26, 32, 44, 0.6);
            transition: color 0.3s ease;
        }

        .radio-option:hover {
            color: #1a202c;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-custom {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.15);
            position: relative;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .radio-option:hover .radio-custom {
            border-color: rgba(0, 123, 255, 0.3);
        }

        .radio-option input[type="radio"]:checked + .radio-custom {
            border-color: #007bff;
            border-width: 2px;
        }

        .radio-option input[type="radio"]:checked + .radio-custom::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00b4d8);
            animation: radioPop 0.3s ease;
        }

        @keyframes radioPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .radio-option .radio-label {
            font-weight: 500;
        }

        .radio-option .radio-desc {
            font-size: 0.75rem;
            color: rgba(26, 32, 44, 0.3);
            display: block;
        }

        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: rgba(26, 32, 44, 0.25);
            margin-top: 8px;
            font-weight: 500;
        }

        .char-count.warning {
            color: #f59e0b;
        }

        .char-count.danger {
            color: #dc3545;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 35px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 20px;
        }

        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
        }

        .modal-icon.warning {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .modal-icon.danger {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }

        .modal-icon.info {
            background: rgba(0, 123, 255, 0.1);
            color: #007bff;
        }

        .modal h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a202c;
            text-align: center;
            margin-bottom: 8px;
        }

        .modal p {
            color: rgba(26, 32, 44, 0.6);
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-actions .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            min-width: 100px;
        }

        .modal-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1a202c;
        }

        .modal-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .modal-actions .btn-danger {
            background: linear-gradient(135deg, #dc3545, #e74c5e);
            color: white;
            box-shadow: 0 4px 20px rgba(220, 53, 69, 0.15);
        }

        .modal-actions .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 53, 69, 0.25);
        }

        .modal-actions .btn-primary {
            background: linear-gradient(135deg, #007bff, #00b4d8);
            color: white;
            box-shadow: 0 4px 20px rgba(0, 123, 255, 0.15);
        }

        .modal-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 123, 255, 0.25);
        }

        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 16px 22px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 14px;
            animation: toastSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.3s ease;
            color: #1a202c;
        }

        .toast .toast-icon {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .toast.success .toast-icon {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }

        .toast.error .toast-icon {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }

        .toast.info .toast-icon {
            background: rgba(0, 123, 255, 0.1);
            color: #007bff;
        }

        .toast .toast-body {
            flex: 1;
        }

        .toast .toast-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .toast .toast-message {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(26, 32, 44, 0.2);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            transition: all 0.2s;
            border-radius: 12px;
        }

        .toast .toast-close:hover {
            color: rgba(26, 32, 44, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .toast.removing {
            animation: toastSlideOut 0.3s ease forwards;
        }

        @keyframes toastSlideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastSlideOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(24px) scale(0.96); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar .btn-back {
            padding: 10px 20px;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1a202c;
            font-family: inherit;
            text-decoration: none;
        }

        .top-bar .btn-back:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .section {
                padding: 20px;
                border-radius: 20px;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .section-title i {
                width: 34px;
                height: 34px;
                font-size: 1.2rem;
            }

            .glass-textarea {
                min-height: 150px;
                padding: 14px 18px;
                font-size: 0.9rem;
            }

            .controls .btn {
                padding: 12px 20px;
                font-size: 0.85rem;
                min-width: 100%;
                flex: 1 1 100%;
            }

            .filename-row {
                flex-direction: column;
                align-items: stretch;
            }

            .radio-group {
                gap: 16px;
            }

            .modal {
                padding: 28px 24px;
                margin: 16px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions .btn {
                width: 100%;
            }

            .toast-container {
                max-width: 90%;
                right: 12px;
                top: 16px;
            }

            .top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon warning" id="modalIcon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 id="modalTitle">Are you sure?</h3>
            <p id="modalMessage">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-danger" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <div class="top-bar">
                <a href="/dashboard" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>

            <div class="section-title">
                <i class="fas fa-file-alt"></i>
                <span>Text to File Converter</span>
            </div>
            <p class="section-subtitle">
                <i class="fas fa-info-circle" style="color:#007bff;"></i>
                Enter your text below and download it as a .txt file
            </p>

            <textarea class="glass-textarea" id="textInput" placeholder="Type or paste your text here..."></textarea>
            <div class="char-count" id="charCount">0 characters</div>

            <div class="filename-row">
                <label><i class="fas fa-tag"></i> Filename:</label>
                <input type="text" id="filenameInput" placeholder="myfile" value="myfile">
                <span class="filename-ext">.txt</span>
            </div>

            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="filename_option" value="simple" checked>
                    <span class="radio-custom"></span>
                    <span class="radio-label">
                        Simple
                        <span class="radio-desc">myfile.txt</span>
                    </span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="filename_option" value="timestamp">
                    <span class="radio-custom"></span>
                    <span class="radio-label">
                        With Timestamp
                        <span class="radio-desc">myfile_20240101_123456.txt</span>
                    </span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="filename_option" value="datetime">
                    <span class="radio-custom"></span>
                    <span class="radio-label">
                        Date & Time
                        <span class="radio-desc">myfile_2024-01-01_12-34-56.txt</span>
                    </span>
                </label>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="downloadBtn">
                    <i class="fas fa-download"></i> Download .txt
                </button>
                <button class="btn btn-danger" id="clearBtn">
                    <i class="fas fa-eraser"></i> Clear
                </button>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const filenameInput = document.getElementById('filenameInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');

        const radioOptions = document.querySelectorAll('input[name="filename_option"]');

        textInput.addEventListener('input', function() {
            const length = this.value.length;
            charCount.textContent = `${length} characters`;
            
            charCount.classList.remove('warning', 'danger');
            if (length > 500) charCount.classList.add('warning');
            if (length > 1000) charCount.classList.add('danger');
        });

        function showConfirm(options) {
            return new Promise((resolve) => {
                modalIcon.className = `modal-icon ${options.type || 'warning'}`;
                modalIcon.innerHTML = `<i class="${options.icon || 'fas fa-exclamation-triangle'}"></i>`;
                modalTitle.textContent = options.title || 'Are you sure?';
                modalMessage.textContent = options.message || 'This action cannot be undone.';
                modalConfirm.textContent = options.confirmText || 'Confirm';
                modalConfirm.className = `btn ${options.confirmClass || 'btn-danger'}`;
                modalCancel.textContent = options.cancelText || 'Cancel';

                modalOverlay.classList.add('active');

                const confirmHandler = () => {
                    modalOverlay.classList.remove('active');
                    modalConfirm.removeEventListener('click', confirmHandler);
                    modalCancel.removeEventListener('click', cancelHandler);
                    resolve(true);
                };

                const cancelHandler = () => {
                    modalOverlay.classList.remove('active');
                    modalConfirm.removeEventListener('click', confirmHandler);
                    modalCancel.removeEventListener('click', cancelHandler);
                    resolve(false);
                };

                modalConfirm.addEventListener('click', confirmHandler);
                modalCancel.addEventListener('click', cancelHandler);

                modalOverlay.addEventListener('click', function(e) {
                    if (e.target === this) {
                        modalOverlay.classList.remove('active');
                        modalConfirm.removeEventListener('click', confirmHandler);
                        modalCancel.removeEventListener('click', cancelHandler);
                        resolve(false);
                    }
                });

                const escHandler = (e) => {
                    if (e.key === 'Escape') {
                        modalOverlay.classList.remove('active');
                        document.removeEventListener('keydown', escHandler);
                        modalConfirm.removeEventListener('click', confirmHandler);
                        modalCancel.removeEventListener('click', cancelHandler);
                        resolve(false);
                    }
                };
                document.addEventListener('keydown', escHandler);
            });
        }

        async function downloadTextFile() {
            const text = textInput.value.trim();
            
            if (!text) {
                showToast('Please enter some text first!', 'error', 'Empty Content');
                return;
            }

            let filename = filenameInput.value.trim() || 'myfile';
            filename = filename.replace(/\.[^/.]+$/, '');

            let selectedOption = 'simple';
            radioOptions.forEach(radio => {
                if (radio.checked) selectedOption = radio.value;
            });

            const now = new Date();
            let timestamp = '';

            if (selectedOption === 'timestamp') {
                timestamp = '_' + 
                    now.getFullYear() +
                    String(now.getMonth() + 1).padStart(2, '0') +
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') +
                    String(now.getMinutes()).padStart(2, '0') +
                    String(now.getSeconds()).padStart(2, '0');
            } else if (selectedOption === 'datetime') {
                timestamp = '_' +
                    now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') + '-' +
                    String(now.getMinutes()).padStart(2, '0') + '-' +
                    String(now.getSeconds()).padStart(2, '0');
            }

            const finalFilename = filename + timestamp + '.txt';

            downloadBtn.disabled = true;
            downloadBtn.innerHTML = `<span class="spinner"></span> Generating...`;

            try {
                const response = await fetch('/txt-file', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        filename: finalFilename,
                        add_timestamp: selectedOption !== 'simple'
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = finalFilename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    showToast(`File "${finalFilename}" downloaded successfully!`, 'success', 'Download Complete');
                } else {
                    const data = await response.json();
                    showToast(data.error || 'Download failed', 'error', 'Error');
                }
            } catch (error) {
                showToast('Failed to download: ' + error.message, 'error', 'Error');
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = `<i class="fas fa-download"></i> Download .txt`;
            }
        }

        async function clearText() {
            const text = textInput.value.trim();
            if (!text) {
                showToast('Nothing to clear', 'info', 'Empty');
                return;
            }

            const confirmed = await showConfirm({
                type: 'danger',
                icon: 'fas fa-exclamation-circle',
                title: 'Clear All Text?',
                message: 'This will permanently delete all the text in the editor.',
                confirmText: 'Yes, Clear All',
                confirmClass: 'btn-danger',
                cancelText: 'Cancel'
            });

            if (confirmed) {
                textInput.value = '';
                charCount.textContent = '0 characters';
                charCount.classList.remove('warning', 'danger');
                textInput.focus();
                showToast('Text cleared successfully', 'info', 'Cleared');
            }
        }

        function showToast(message, type = 'info', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            const titles = {
                success: 'Success',
                error: 'Error',
                warning: 'Warning',
                info: 'Information'
            };
            
            toast.innerHTML = `
                <div class="toast-icon"><i class="${icons[type] || icons.info}"></i></div>
                <div class="toast-body">
                    <div class="toast-title">${title || titles[type] || 'Information'}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.closest('.toast').remove()"><i class="fas fa-times"></i></button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('removing');
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 300);
                }
            }, 4000);
            
            toast.addEventListener('click', (e) => {
                if (e.target.closest('.toast-close')) return;
                toast.classList.add('removing');
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 300);
            });
        }

        downloadBtn.addEventListener('click', downloadTextFile);
        clearBtn.addEventListener('click', clearText);

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                downloadTextFile();
            }
        });

        textInput.dispatchEvent(new Event('input'));
    </script>
</body>
</html>
